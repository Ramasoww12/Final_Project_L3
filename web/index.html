<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projet IaC - Terraform AWS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 30px;
            text-align: center;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        h2 {
            color: #374151;
        }

        .status {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>Projet IaC avec Terraform</h1>
        <p>Infrastructure automatisée sur AWS</p>
    </header>

    <main>

        <div class="card">
            <h2>Infrastructure</h2>

            <p>
                Cette application est déployée sur une infrastructure
                créée automatiquement avec Terraform.
            </p>
        </div>

        <div class="card">
            <h2>Technologies utilisées</h2>

            <ul>
                <li>Terraform</li>
                <li>AWS</li>
                <li>Amazon EC2</li>
                <li>Ubuntu</li>
                <li>Nginx</li>
            </ul>
        </div>

        <div class="card">
            <h2>État du serveur</h2>

            <p class="status">
                Serveur opérationnel
            </p>
        </div>

    </main>

</body>
</html>
